name: CI

on:
  # NO branch-name filter, deliberately. `on.push.branches` cannot take a
  # dynamic default-branch token — workflow triggers are parsed before any
  # context exists, so `github.event.repository.default_branch` is unavailable
  # here. Enumerating names (`[main]`, `[master]`, or both) is how a workflow
  # silently never runs on a repo whose default is spelled differently.
  # Running on every push and every PR is the only spelling that cannot be
  # wrong; gate on the default branch at JOB level, where the context exists:
  #   if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
  push:
  pull_request:
  workflow_dispatch:

# Supersede obsolete runs of THIS workflow only. `github.workflow` in the key is
# load-bearing — without it every workflow for a PR shares one group and a newly
# started workflow cancels an unrelated one that was already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Documentation-only repo: no build and no package manager. The gate needs
      # only bash, python3, jq and git, all preinstalled on ubuntu-latest. It runs
      # agent drift, feature equivalence, platform targets, action pinning and the
      # book check (`scripts/check-book.py --no-mermaid`; Mermaid rendering needs
      # mmdc and a browser, so it stays a local `make check-book` step). The doc
      # standards for README.md and docs/ run in the next step.
      - name: Run repo checks
        run: make agent:check
      - name: Check doc standards (README.md and docs/)
        run: make check-doc-standards

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan for high-signal secret patterns
        run: |
          if grep -rE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})' --include='*.json' --include='*.yml' .; then
            exit 1
          fi
          echo "No secrets found"

  action-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/check-action-pinning.sh .
