version: 2
updates:
  # Documentation-only repo: no package.json and no pyproject.toml, so there is
  # no npm or pip block.

  # GitHub Actions — always present, monthly cadence, grouped.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - chore
