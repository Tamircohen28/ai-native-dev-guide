<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">ai-native-dev-guide</title>
  <desc id="d">Motif: a six-step staircase rising from lower left to a flagged beacon at upper right, with the climbing path passing through an agent loop of four tiles (prompt, plan, tools, verify) and a dashed return arc. It pictures what the book is: a guided path through six levels, from zero to hero, built around the loop a coding agent runs.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#111726"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="stair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#1B2A63" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#7A4DE0"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC66B"/>
      <stop offset="1" stop-color="#F08A3C"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#FFB454"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- substrate: a faint grid with two circuit traces -->
  <g stroke="#1B2434" stroke-width="1" fill="none" opacity="0.7">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M120 0 V400 M280 0 V400 M440 0 V400 M600 0 V400 M760 0 V400 M920 0 V400 M1080 0 V400"/>
    <path d="M280 320 H360 V360 H440"/>
    <path d="M1080 240 H1140 V320 H1200"/>
  </g>
  <circle cx="360" cy="320" r="4" fill="#22303F"/>
  <circle cx="1140" cy="240" r="4" fill="#22303F"/>

  <!-- glow behind the loop -->
  <ellipse cx="880" cy="200" rx="300" ry="180" fill="url(#glow)" filter="url(#soft)"/>

  <!-- six steps, lowest to highest -->
  <g>
    <rect x="612" y="312" width="78" height="38" rx="6" fill="url(#stair)" opacity="0.4"/>
    <rect x="698" y="270" width="78" height="80" rx="6" fill="url(#stair)" opacity="0.5"/>
    <rect x="784" y="228" width="78" height="122" rx="6" fill="url(#stair)" opacity="0.6"/>
    <rect x="870" y="186" width="78" height="164" rx="6" fill="url(#stair)" opacity="0.7"/>
    <rect x="956" y="144" width="78" height="206" rx="6" fill="url(#stair)" opacity="0.8"/>
    <rect x="1042" y="102" width="78" height="248" rx="6" fill="url(#stair)" opacity="0.9"/>
    <rect x="612" y="312" width="78" height="5" rx="2.5" fill="#9DB2FF" opacity="0.55"/>
    <rect x="698" y="270" width="78" height="5" rx="2.5" fill="#9DB2FF" opacity="0.65"/>
    <rect x="784" y="228" width="78" height="5" rx="2.5" fill="#9DB2FF" opacity="0.75"/>
    <rect x="870" y="186" width="78" height="5" rx="2.5" fill="#9DB2FF" opacity="0.85"/>
    <rect x="956" y="144" width="78" height="5" rx="2.5" fill="#9DB2FF" opacity="0.95"/>
    <rect x="1042" y="102" width="78" height="5" rx="2.5" fill="#FFB454"/>
    <line x1="596" y1="352" x2="1136" y2="352" stroke="#22303F" stroke-width="2"/>
  </g>

  <!-- the climbing path: into the loop at "prompt", out of it at "verify" -->
  <g fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round">
    <line x1="608" y1="321" x2="796" y2="229"/>
    <line x1="936" y1="161" x2="1081" y2="90"/>
  </g>
  <circle cx="651" cy="300" r="6" fill="#0B0E14" stroke="#6E8BFF" stroke-width="3"/>
  <circle cx="737" cy="258" r="6" fill="#0B0E14" stroke="#6E8BFF" stroke-width="3"/>
  <circle cx="995" cy="132" r="6" fill="#0B0E14" stroke="#F0A04B" stroke-width="3"/>

  <!-- the agent loop, in front of the stairs -->
  <circle cx="866" cy="195" r="100" fill="#0B0E14" opacity="0.86"/>
  <circle cx="866" cy="195" r="100" fill="none" stroke="#2A3550" stroke-width="1.5" opacity="0.8"/>
  <path d="M795.9 229.2 A78 78 0 0 1 936.1 160.8" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
  <path d="M936.1 160.8 A78 78 0 0 1 795.9 229.2" fill="none" stroke="#6E8BFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 11" opacity="0.75"/>
  <polygon points="-7,-6 7,0 -7,6" fill="#8EA4FF" transform="translate(788.2 189.6) rotate(-86)"/>
  <polygon points="-7,-6 7,0 -7,6" fill="#A99BFF" transform="translate(831.8 124.9) rotate(-26)"/>
  <polygon points="-7,-6 7,0 -7,6" fill="#E2A873" transform="translate(909.6 130.3) rotate(34)"/>
  <polygon points="-7,-6 7,0 -7,6" fill="#6E8BFF" opacity="0.85" transform="translate(900.2 265.1) rotate(154)"/>

  <!-- the model at the centre of the loop -->
  <circle cx="866" cy="195" r="26" fill="url(#glow)"/>
  <circle cx="866" cy="195" r="18" fill="none" stroke="#9DB2FF" stroke-width="2" opacity="0.4"/>
  <circle cx="866" cy="195" r="7" fill="#E6EDF3" opacity="0.92"/>

  <!-- prompt -->
  <rect x="776" y="209" width="40" height="40" rx="10" fill="url(#tile)"/>
  <path d="M787 222 l7 7 l-7 7 M798 237 h8" fill="none" stroke="#F4F6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- plan -->
  <rect x="781" y="131" width="40" height="40" rx="10" fill="url(#tile)"/>
  <path d="M792 143 h18 M792 151 h18 M792 159 h11" fill="none" stroke="#F4F6FF" stroke-width="3" stroke-linecap="round"/>
  <!-- tools -->
  <rect x="851" y="97" width="40" height="40" rx="10" fill="url(#tile)"/>
  <polygon points="881,117 876,125.7 866,125.7 861,117 866,108.3 876,108.3" fill="none" stroke="#F4F6FF" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="871" cy="117" r="2.5" fill="#F4F6FF"/>
  <!-- verify: the gate the path leaves through -->
  <rect x="916" y="141" width="40" height="40" rx="10" fill="url(#gate)"/>
  <path d="M927 161 l6 7 l12 -14" fill="none" stroke="#1A1206" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the top step: a flagged beacon -->
  <circle cx="1081" cy="90" r="46" fill="url(#beacon)"/>
  <line x1="1081" y1="90" x2="1081" y2="48" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1081,48 1108,57 1081,66" fill="url(#gate)"/>
  <circle cx="1081" cy="90" r="7" fill="#FFB454" stroke="#0B0E14" stroke-width="2"/>

  <!-- accent rule under the wordmark -->
  <rect x="64" y="214" width="120" height="5" rx="2.5" fill="url(#route)"/>

  <text x="64" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#E6EDF3">ai-native-dev-guide</text>
  <text x="64" y="262" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8B949E">AI-Native Development: Zero to Hero</text>
</svg>
