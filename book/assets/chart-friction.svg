<svg xmlns="http://www.w3.org/2000/svg" width="860" height="717" viewBox="0 0 860 717" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Over-eager guards were the most widespread friction: 26 of 37 sessions</title>
<desc id="d">Guards that block or nag legitimate work: 26 of 37 sessions (199 hook blocks, plus 452 in subagents); Silent waits and the “status?” poke: 22 of 37 sessions (218 status pokes); Context bloat, compaction, lost instructions: 22 of 37 sessions (86 compactions); “Done” without evidence: 20 of 37 sessions (60 agent self-corrections); Shell traps: zsh, macOS, quoting: 19 of 37 sessions (36 errors, plus 112 in subagents); Approval friction: 17 of 37 sessions (blanket approval re-typed 33 times); Subagents that stall, die or return nothing: 16 of 37 sessions (52 runs ended blocked or partial); CI capacity: is it the code or the host?: 16 of 37 sessions (flaky-test or runner discussion); Bouncing manual work back to the owner: 14 of 37 sessions (“do it yourself” prompts (about 14 sessions)); Sessions that take hours: 10 of 37 sessions (slow / too-long complaints (about 10 sessions)); Scripted edits that silently corrupt: 9 of 37 sessions (18 inline-script edits denied by the safety check); Parallel agents and sessions colliding: 5 of 37 sessions (duplicate PRs or watchers mentioned); Usage and rate limits: 5 of 37 sessions (limit messages (about 5 sessions))</desc>
<rect x="0.5" y="0.5" width="859" height="716" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-opacity="0.12"/>
<text x="28" y="44" font-size="20" fill="#191919" font-weight="600">Over-eager guards were the most widespread friction: 26 of 37 sessions</text>
<text x="28" y="67" font-size="13" fill="#666666">Sessions in which each friction category appeared, of 37 substantive sessions (regex counts, ±30%). Grey line: what was counted. 5</text>
<text x="28" y="85" font-size="13" fill="#666666">categories reached more than half of the sessions; 5 categories with no per-session count are not plotted.</text>
