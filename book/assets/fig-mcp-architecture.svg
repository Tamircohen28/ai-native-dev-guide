<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="t d">
<title id="t">How MCP connects an application to its tools</title>
<desc id="d">An application connects through an MCP client to a local MCP server over stdio and to a remote MCP server over Streamable HTTP. Servers expose tools, resources and prompts. The client sends tools/list, then tools/call.</desc>
<defs><marker id="ah1b2430" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9.2,5 L1,8.6 Z" fill="#1B2430"/></marker><marker id="ah465062" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9.2,5 L1,8.6 Z" fill="#465062"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="688.5" rx="14" fill="#F5F2EA" stroke="#D9D2C2" stroke-width="1.5"/>
<text x="32" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2430">How MCP connects an application to its tools</text>
<text x="32" y="73" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#465062">One protocol, two standard transports. Servers expose tools, resources and prompts.</text>
<path d="M26,92 H934 Q948,92 948,106 V270 Q948,284 934,284 H402 Q388,284 388,298 V414 Q388,428 374,428 H26 Q12,428 12,414 V106 Q12,92 26,92 Z" fill="#ECE7DA"/>
<text x="30" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#58616F" letter-spacing="1">YOUR MACHINE</text>
<text x="936" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#58616F" text-anchor="end" letter-spacing="1">REMOTE</text>
<rect x="28" y="126" width="344" height="290" rx="12" fill="#FFFEFB" stroke="#2B5BC7" stroke-width="1.5"/>
<text x="46" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430">Application</text>
<text x="46" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062">for example, Claude Code</text>
<text x="46" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062">Tools reach the model as</text>
<text x="46" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">mcp__&lt;server&gt;__&lt;tool&gt;</tspan></text>
<rect x="46" y="250" width="140" height="74" rx="10" fill="#E1E9FA" stroke="#2B5BC7" stroke-width="1.5"/>
<text x="116" y="281.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle">Model</text>
<text x="116" y="303.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">chooses a tool</text>
<path d="M186,275 C214,275 204,226 232,226" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<path d="M186,299 C214,299 204,348 232,348" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="46" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A45B0">A human should always be</text>
<text x="46" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7A45B0">able to deny a tool call.</text>
