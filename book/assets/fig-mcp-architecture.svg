<circle cx="356" cy="226" r="5.5" fill="#09736A" stroke="#FFFEFB" stroke-width="1.5"/>
<circle cx="668" cy="226" r="5.5" fill="#465062" stroke="#FFFEFB" stroke-width="1.5"/>
