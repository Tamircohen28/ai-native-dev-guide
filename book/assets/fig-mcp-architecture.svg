<circle cx="668" cy="348" r="5.5" fill="#465062" stroke="#FFFEFB" stroke-width="1.5"/>
<text x="512" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" fill="#1B2430">stdio</tspan><tspan dx="6">for local servers</tspan></text>
<text x="512" y="247" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">the client launches the server as a</text>
<text x="512" y="264" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">subprocess; newline-delimited messages</text>
<text x="528" y="334" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#465062" text-anchor="middle"><tspan font-weight="700" fill="#1B2430">Streamable HTTP</tspan><tspan dx="6">for remote servers</tspan></text>
<text x="528" y="369" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">each client message is an HTTP POST</text>
<text x="528" y="386" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">to a single MCP endpoint</text>
<rect x="24" y="448" width="912" height="196" rx="12" fill="#FFFEFB" stroke="#C9C1AF" stroke-width="1.5"/>
<text x="44" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430">The same exchange on either transport</text>
<text x="916" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F" text-anchor="end">JSON-RPC, UTF-8</text>
<path d="M200,518 L200,632" fill="none" stroke="#C9C1AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<rect x="155.361" y="492" width="89.277" height="26" rx="13" fill="#D9F0EC" stroke="#09736A" stroke-width="1.25"/>
<text x="200" y="509.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430" text-anchor="middle">MCP client</text>
<path d="M760,518 L760,632" fill="none" stroke="#C9C1AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<rect x="712.18" y="492" width="95.6401" height="26" rx="13" fill="#F5F2EA" stroke="#465062" stroke-width="1.25"/>
<text x="760" y="509.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430" text-anchor="middle">MCP server</text>
<path d="M204,540 L755,540" fill="none" stroke="#1B2430" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah1b2430)"/>
<text x="480" y="533" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">tools/list</tspan><tspan> · discover, paginated with </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">cursor</tspan><tspan> and </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">nextCursor</tspan></text>
<path d="M756,568 L205,568" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ah465062)"/>
<text x="480" y="561" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">the server's tools</text>
<path d="M204,596 L755,596" fill="none" stroke="#1B2430" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah1b2430)"/>
<text x="480" y="589" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">tools/call</tspan><tspan> { </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">name</tspan><tspan>, </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">arguments</tspan><tspan> } · the tool the model chose</tspan></text>
<path d="M756,624 L205,624" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ah465062)"/>
<text x="480" y="617" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan>result, with </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">isError: true</tspan><tspan> if the tool itself failed</tspan></text>
<text x="32" y="670" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F"><tspan>Spec revision 2026-07-28 is stateless: no </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#465062">initialize</tspan><tspan> handshake; every request carries its protocol version in </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#465062">_meta</tspan><tspan>.</tspan></text>
</svg>
