<rect x="740.554" y="228" width="79.3528" height="26" rx="13" fill="#E7E1D3"/>
<text x="780.231" y="245.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle">resources</text>
<rect x="827.907" y="228" width="68.8342" height="26" rx="13" fill="#E7E1D3"/>
<text x="862.324" y="245.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle">prompts</text>
<rect x="668" y="302" width="268" height="92" rx="10" fill="#FFFEFB" stroke="#465062" stroke-width="1.5"/>
<text x="684" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430">MCP server</text>
<text x="920" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F" text-anchor="end">remote service</text>
<rect x="684" y="350" width="48.5542" height="26" rx="13" fill="#E7E1D3"/>
<text x="708.277" y="367.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle">tools</text>
<rect x="740.554" y="350" width="79.3528" height="26" rx="13" fill="#E7E1D3"/>
<text x="780.231" y="367.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle">resources</text>
<rect x="827.907" y="350" width="68.8342" height="26" rx="13" fill="#E7E1D3"/>
