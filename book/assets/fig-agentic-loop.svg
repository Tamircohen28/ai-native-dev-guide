<svg xmlns="http://www.w3.org/2000/svg" width="960" height="652" viewBox="0 0 960 652" role="img" aria-labelledby="t d">
<title id="t">The agent loop</title>
<desc id="d">A user prompt goes to the model. While the model stops with stop_reason tool_use, each tool_use block passes PreToolUse hooks and permission rules, the harness runs the tool, and a tool_result goes back to the model. The loop ends with end_turn.</desc>
<defs><marker id="ah465062" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9.2,5 L1,8.6 Z" fill="#465062"/></marker><marker id="ahb93a32" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.4 L9.2,5 L1,8.6 Z" fill="#B93A32"/></marker></defs>
<rect x="0.75" y="0.75" width="958.5" height="650.5" rx="14" fill="#F5F2EA" stroke="#D9D2C2" stroke-width="1.5"/>
<text x="32" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2430">The agent loop</text>
<text x="32" y="73" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#465062">The model asks for tools until it can answer. The harness runs them, never the model.</text>
<rect x="16" y="418" width="928" height="218" rx="14" fill="#ECE7DA"/>
<text x="36" y="594" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#465062">Inside the harness</text>
<text x="36" y="613" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F">Claude Code runs every step in this band.</text>
<rect x="32" y="108" width="200" height="74" rx="10" fill="#EEE3F7" stroke="#7A45B0" stroke-width="1.5"/>
<text x="132" y="139.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle">Your prompt</text>
<text x="132" y="161.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">joins the conversation</text>
<rect x="380" y="108" width="200" height="74" rx="10" fill="#E1E9FA" stroke="#2B5BC7" stroke-width="1.5"/>
<text x="480" y="139.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle">Model</text>
<text x="480" y="161.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">reads the whole context</text>
<rect x="728" y="108" width="200" height="74" rx="10" fill="#FFFEFB" stroke="#1B2430" stroke-width="2"/>
<text x="828" y="139.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle">Final answer</text>
<text x="828" y="161.3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">Stop</tspan><tspan> hooks fire here</tspan></text>
<path d="M232,145 L376,145" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="304" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F" text-anchor="middle">request</text>
<path d="M580,145 L724,145" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="652" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">stop_reason:</tspan></text>
<text x="652" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">"end_turn"</tspan></text>
<rect x="32" y="262" width="240" height="84" rx="10" fill="#FFFEFB" stroke="#58616F" stroke-width="1.5"/>
<text x="152" y="289.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B2430">tool_result</tspan></text>
<text x="152" y="311.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">tool_use_id</tspan><tspan> · </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">content</tspan></text>
<text x="152" y="328.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan>optional </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">is_error: true</tspan></text>
<rect x="688" y="262" width="240" height="84" rx="10" fill="#FFFEFB" stroke="#58616F" stroke-width="1.5"/>
<text x="808" y="289.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B2430">tool_use</tspan></text>
<text x="808" y="311.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">id</tspan><tspan> · </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">name</tspan><tspan> · </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">input</tspan></text>
<text x="808" y="328.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">one or more per reply</text>
<path d="M530,182 V294 Q530,304 540,304 H684" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="542" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">stop_reason:</tspan></text>
<text x="542" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">"tool_use"</tspan></text>
<path d="M272,304 H420 Q430,304 430,294 V186" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="418" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="end">appended to messages,</text>
<text x="418" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="end">then a new request</text>
<rect x="688" y="436" width="240" height="84" rx="10" fill="#FBEBCF" stroke="#9A5205" stroke-width="1.5"/>
<text x="808" y="463.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1B2430">PreToolUse</tspan><tspan> hooks</tspan></text>
<text x="808" y="485.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">your code runs first;</text>
<text x="808" y="502.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">exit code 2 blocks the call</text>
<rect x="360" y="436" width="240" height="84" rx="10" fill="#D9F0EC" stroke="#09736A" stroke-width="1.5"/>
<text x="480" y="463.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle">Permission rules, then mode</text>
<text x="480" y="485.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">deny</tspan><tspan>, then </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">ask</tspan><tspan>, then </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">allow</tspan><tspan>;</tspan></text>
<text x="480" y="502.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">the mode settles the rest</text>
<rect x="32" y="436" width="240" height="84" rx="10" fill="#FFFEFB" stroke="#465062" stroke-width="1.5"/>
<text x="152" y="463.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B2430" text-anchor="middle">Tool runs</text>
<text x="152" y="485.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">the harness executes it,</text>
<text x="152" y="502.8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#465062" text-anchor="middle">never the model</text>
<path d="M808,346 L808,432" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<path d="M688,478 L604,478" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="646" y="469" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F" text-anchor="middle">no block</text>
<path d="M360,478 L276,478" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<text x="318" y="469" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#58616F" text-anchor="middle">allowed</text>
<path d="M152,436 L152,350" fill="none" stroke="#465062" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah465062)"/>
<rect x="166" y="380" width="149.359" height="24" rx="12" fill="#FBEBCF" stroke="#9A5205" stroke-width="1.25"/>
<text x="240.68" y="396.55" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1B2430">PostToolUse</tspan><tspan> hooks</tspan></text>
<text x="516" y="397" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#465062" text-anchor="middle"><tspan>Repeats while </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#1B2430">stop_reason</tspan><tspan> is </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#1B2430">"tool_use"</tspan></text>
<rect x="360" y="574" width="568" height="42" rx="10" fill="#F9E1DE" stroke="#B93A32" stroke-width="1.5"/>
<text x="644" y="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#B93A32" text-anchor="middle">Blocked: the tool does not run</text>
<path d="M480,520 L480,570" fill="none" stroke="#B93A32" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahb93a32)"/>
<text x="492" y="551" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#B93A32"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#B93A32">deny</tspan><tspan> rule, or you decline</tspan></text>
<path d="M808,520 L808,570" fill="none" stroke="#B93A32" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ahb93a32)"/>
<text x="820" y="551" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#B93A32">exit code 2</text>
</svg>
