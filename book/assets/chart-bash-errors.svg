<text x="28" y="44" font-size="20" fill="#191919" font-weight="600">Guardrail refusals are 27% of Bash errors; zsh and sed traps add another 15%</text>
<text x="28" y="67" font-size="13" fill="#666666">Bash calls the harness flagged as errors, by class of the first error-like output line (n = 2,213, which is 2.42% of 91,450 Bash calls).</text>
<text x="28" y="85" font-size="13" fill="#666666">The classifier is heuristic.</text>
