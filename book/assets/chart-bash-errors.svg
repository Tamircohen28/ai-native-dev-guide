<title id="t">Guardrail refusals are 27% of Bash errors; zsh and sed traps add another 15%</title>
<desc id="d">Other non-zero exit: 516 (23.3%); Blocked by a PreToolUse hook: 394 (17.8%); Non-zero exit, no error line in the output: 299 (13.5%); Refused by the harness (sleep-poll, safety check): 204 (9.2%); zsh: unquoted word starting with =: 118 (5.3%); sed syntax error (BSD sed): 111 (5.0%); zsh: no matches found (unquoted glob): 110 (5.0%); No such file or directory: 97 (4.4%); Tests or checks reported failures: 88 (4.0%); Python traceback: 75 (3.4%); 10 further classes: 201 (9.1%)</desc>
