<title id="t">72% of human prompts are shorter than 50 characters</title>
<desc id="d">Under 50 characters: 812 (71.9%); 50 to 199: 245 (21.7%); 200 to 999: 52 (4.6%); 1,000 to 4,999: 19 (1.7%); 5,000 or more: 2 (0.2%)</desc>
