<text x="28" y="67" font-size="13" fill="#666666">Human prompts on the main thread by length in characters (n = 1,130; slash commands and prompts queued mid-turn are not</text>
<text x="28" y="85" font-size="13" fill="#666666">included). 94% are under 200 characters; 21 run to 1,000 or more.</text>
